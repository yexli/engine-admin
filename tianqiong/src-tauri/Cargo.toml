[package]
name = "tianqiong2"
version = "0.1.0"
description = "天穹纪元 2.0 —— 世界书驱动的 AI+RPG 单机游戏（桌面壳）"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
